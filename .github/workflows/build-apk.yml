
name: Build GZAR ARCHIVE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CreativeArchiveAndroid_Starter.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o CreativeArchiveAndroid_Starter.zip -d unpacked
          test -f unpacked/CreativeArchiveAndroid/app/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: unpacked/CreativeArchiveAndroid
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: GZAR-ARCHIVE-APK
          path: unpacked/CreativeArchiveAndroid/app/build/outputs/apk/debug/app-debug.apk
